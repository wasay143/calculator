    <section class="contact">
        <h1>Contact Us</h1>

        <p>Email: wasay@example.com</p>
        <p>Phone: +92 300 1234567</p>
        <p>Address: Karachi, Pakistan</p>

        <h2>Send Us a Message</h2>

        <form action="mailto:wasay@example.com" method="post" enctype="text/plain">

            <label>Name:</label>
            <input type="text" name="name" required>

            <label>Email:</label>

        </form>
    </section>
